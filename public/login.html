<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshMart Admin Portal — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      max-width: 420px;
      margin: 5rem auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      font-size: 1.5rem;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }
    .demo-credentials {
      background: #f0fdf4;
      border: 1px dashed #86efac;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #166534;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="/" class="brand-logo">
        🛒 Fresh<span>Mart</span>
      </a>
      <a href="/" class="btn-admin">← Back to Storefront</a>
    </nav>
  </header>

  <main>
    <div class="login-container">
      <div class="login-header">
        <span style="font-size: 2.5rem;">🔐</span>
        <h1>Admin Authentication</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to manage inventory, categories, orders & reports</p>
      </div>

      <div class="demo-credentials">
        <strong>Default Credentials (Viva Demo):</strong><br>
        Username: <code>admin</code><br>
        Password: <code>admin123</code>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginBtn" class="btn-add-cart" style="margin-top: 1.25rem;">
          Sign In to Dashboard
        </button>
      </form>
    </div>
  </main>

  <script src="lib/jquery.min.js"></script>
  <script src="js/validation.js"></script>
  <script>
    $(document).ready(function() {
      // Check if already logged in
      $.get('/api/auth/me', function(res) {
        if (res.authenticated) {
          window.location.href = '/admin';
        }
      });

      $('#adminLoginForm').on('submit', function(e) {
        e.preventDefault();
        Validator.clearAllErrors(this);

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        let valid = true;

        if (!Validator.isRequired(usernameInput.value)) {
          Validator.showError(usernameInput, 'Username is required.');
          valid = false;
        }

        if (!Validator.isRequired(passwordInput.value)) {
          Validator.showError(passwordInput, 'Password is required.');
          valid = false;
        }

        if (!valid) return;

        const btn = $('#loginBtn');
        btn.prop('disabled', true).text('Verifying credentials...');

        $.ajax({
          url: '/api/auth/login',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value
          }),
          success: function(res) {
            if (res.success) {
              showToast('Login successful! Redirecting...', 'success');
              setTimeout(() => {
                window.location.href = '/admin';
              }, 700);
            }
          },
          error: function(xhr) {
            btn.prop('disabled', false).text('Sign In to Dashboard');
            const err = xhr.responseJSON ? xhr.responseJSON.message : 'Login failed.';
            showToast(err, 'error');
            Validator.showError(passwordInput, err);
          }
        });
      });
    });
  </script>
</body>
</html>
